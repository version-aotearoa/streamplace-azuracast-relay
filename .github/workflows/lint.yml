# SPDX-License-Identifier: AGPL-3.0-only
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: python -m py_compile feeder/*.py relay/*.py

      - name: Shellcheck
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S warning feeder/*.sh relay/*.sh

      - name: YAML parse
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob("**/*.yml", recursive=True) + glob.glob("**/*.yaml", recursive=True):
              try:
                  list(yaml.safe_load_all(open(f)))
              except Exception as e:
                  print(f"{f}: {e}")
                  bad = 1
          sys.exit(bad)
          PY

      - name: No secrets committed
        run: |
          if git ls-files | grep -E '\.(env|pem|key|p12)$'; then
            echo "secret-like files are tracked"; exit 1
          fi
